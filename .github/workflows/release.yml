name: Tasks Release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, mbstring
          coverage: none
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Stop if release already exists
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then echo "Release already exists; bump VERSION."; exit 1; fi
      - name: Build and validate
        run: bash build/build.sh
      - name: Synchronize Joomla update checksum
        run: php build/update-feed-checksum.php
      - name: Verify release checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"; PACKAGE="dist/pkg_xdecarotasks_${VERSION}.zip"; SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          grep -q "<sha256>${SHA256}</sha256>" updates/pkg_xdecarotasks.xml
          grep -q "${SHA256}  pkg_xdecarotasks_${VERSION}.zip" dist/SHA256SUMS.txt
      - name: Create GitHub release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" "dist/com_xdecarotasks_${VERSION}.zip" "dist/plg_task_xdecarotasks_${VERSION}.zip" "dist/pkg_xdecarotasks_${VERSION}.zip" dist/SHA256SUMS.txt --title "Tasks by xdecaro ${VERSION}" --notes "Tasks by xdecaro ${VERSION}. Stable task lifecycle, assignments, checklist, comments, history, due-date reminders and optional Core/Notifications integration."
      - name: Publish update-feed checksum
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_xdecarotasks.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish SHA-256 for Tasks by xdecaro ${{ steps.version.outputs.version }}"
          git pull --rebase origin main; git push origin HEAD:main
